[project]
name = "fundly"
dynamic = ["version"]
description = "Prices, history and search for mutual funds, ETFs and pension plans worldwide, by ISIN, ticker or local code"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Windows has no system time-zone database; zoneinfo needs tzdata there.
dependencies = ["httpx>=0.27", "tzdata; sys_platform == 'win32'"]
keywords = ["funds", "mutual funds", "etf", "nav", "isin", "pension", "morningstar", "finance", "fondos de inversión", "planes de pensiones"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/antooro/fundly"
Source = "https://github.com/antooro/fundly"
Issues = "https://github.com/antooro/fundly/issues"
Changelog = "https://github.com/antooro/fundly/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pandas>=1.5", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fundly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["fundly"]

[tool.hatch.build.targets.sdist]
include = ["fundly", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: hits the real sources (deselected by default; run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and non-ASCII names in fund data comments are intended

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
